name: Train → Test → Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (for testing)
        run: pip install -r requirements.txt

      - name: Retrain Model
        run: python src/train.py

      - name: Run Tests
        run: python -m pytest tests/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS Lambda
        run: |
          set -e
          # Install only production dependencies
          pip install -r requirements.txt -t ./lambda_package
          # Copy your source code
          cp -r src/* ./lambda_package/
          # Build zip from lambda_package, excluding unnecessary files
          cd lambda_package
          zip -r ../deploy.zip . -x "*.pyc" -x "__pycache__/*" -x "tests/*" -x "docs/*"
          cd ..
          # Show zip file size for debugging
          ls -lh deploy.zip
          # Deploy
          aws lambda update-function-code \
            --function-name ml-employee-salary-predictor \
            --zip-file fileb://deploy.zip